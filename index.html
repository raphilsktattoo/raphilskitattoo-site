elative;height:760px;overflow:hidden\">\n<x-import component-from-global-scope=\"plasma-shader\" from=\"2cb11e25-1037-436f-b582-9960593c7c75#/plasma-shader.js\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fx-import>\n<div style=\"position:absolute;inset:0;background:linear-gradient(100deg,rgba(19,18,17,.92) 0%,rgba(19,18,17,.58) 46%,rgba(19,18,17,.26) 100%)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;padding:0 clamp(20px,4vw,48px)\">\n<div style=\"display:flex;flex-direction:column;gap:26px;animation:stUp .8s cubic-bezier(.2,.8,.2,1) both\">\n<div style=\"font:600 10px/1 Archivo,sans-serif;letter-spacing:.42em;color:#ff563c\">HIPER REALISTIC TATTOO ARTIST<\u002Fdiv>\n<div style=\"font:800 clamp(52px,5.6vw,84px)/.9 Archivo,sans-serif;letter-spacing:-.04em;text-transform:uppercase\">Histórias<br>viram<br>arte<\u002Fdiv>\n<div style=\"height:2px;background:rgba(243,242,242,.4);width:100%;max-width:420px\"><\u002Fdiv>\n<div style=\"font:400 17px/1.55 Archivo,sans-serif;color:#d7d3d3;max-width:470px;text-wrap:pretty\">Mais de 10 anos transformando memórias e significados em tatuagem. Cada projeto é único e respeita a essência de quem o carrega.<\u002Fdiv>\n<div style=\"display:flex;gap:2px;margin-top:6px;flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ goBook }}\" style=\"appearance:none;border:0;border-radius:0;background:#ff563c;color:#131211;padding:22px clamp(18px,3vw,30px);display:flex;align-items:center;gap:clamp(14px,3vw,44px);font:800 15px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap\" style-hover=\"background:#ff9783\"><span>Agendar minha sessão<\u002Fspan><span>→<\u002Fspan><\u002Fbutton>\n<a href=\"#portfolio\" style=\"border:2px solid rgba(243,242,242,.4);padding:22px 26px;display:flex;align-items:center;font:600 12px/1 Archivo,sans-serif;letter-spacing:.16em;color:#f3f2f2;text-decoration:none;text-transform:uppercase;white-space:nowrap\" style-hover=\"border-color:#ff563c\">Ver portfólio<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border-bottom:2px solid rgba(243,242,242,.18)\">\n<sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n<div style=\"padding:clamp(24px,3vw,36px) clamp(20px,3vw,32px);border-right:2px solid rgba(243,242,242,.18);display:flex;flex-direction:column;gap:12px\">\n<div style=\"font:800 44px/1 Archivo,sans-serif;letter-spacing:-.03em;color:#ff563c\">{{ s.n }}<\u002Fdiv>\n<div style=\"font:600 13px/1.35 Archivo,sans-serif;letter-spacing:.16em;color:#7d7979;max-width:150px\">{{ s.k }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div id=\"portfolio\" style=\"padding:clamp(48px,7vw,80px) clamp(20px,4vw,48px) 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:22px\">\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:600 10px/1 Archivo,sans-serif;letter-spacing:.26em;color:#ff563c\">PORTFÓLIO<\u002Fdiv>\n<div style=\"font:800 clamp(38px,3.9vw,56px)/.94 Archivo,sans-serif;letter-spacing:-.035em;text-transform:uppercase\">Trabalhos<br>recentes<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:2px;flex-wrap:wrap\">\n<sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n<div sc-camel-on-click=\"{{ f.pick }}\" style=\"padding:13px 18px;border:2px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};font:600 10.5px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap\">{{ f.label }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:2px;background:rgba(243,242,242,.4)\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;padding:2px clamp(20px,4vw,48px) 0\">\n<sc-for list=\"{{ shown }}\" as=\"w\" hint-placeholder-count=\"6\">\n<div sc-camel-on-click=\"{{ w.open }}\" style=\"position:relative;cursor:pointer;overflow:hidden\">\n<div style=\"width:100%;height:460px;background-image:url({{ w.img }});background-size:cover;background-position:{{ w.pos }};transition:transform .6s cubic-bezier(.2,.8,.2,1)\" style-hover=\"transform:scale(1.04)\"><\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:0;padding:52px 20px 18px;background:linear-gradient(180deg,rgba(19,18,17,0),rgba(19,18,17,.9));display:flex;justify-content:space-between;align-items:flex-end\">\n<span style=\"font:600 10.5px/1 Archivo,sans-serif;letter-spacing:.14em;color:#bab6b6;text-transform:uppercase\">{{ w.style }}<\u002Fspan>\n<span style=\"flex:none;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;color:#ff563c\">{{ w.hours }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div id=\"artista\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0;margin-top:clamp(48px,7vw,80px);border-top:2px solid rgba(243,242,242,.18)\">\n\n<img loading=\"lazy\" decoding=\"async\" src=\"07f745d0-1b50-44ed-9eae-545f205e2c5e\" alt=\"Raphael Raphilski\" style=\"width:100%;height:100%;min-height:clamp(380px,56vw,660px);object-fit:cover;object-position:50% 30%;display:block;filter:grayscale(1) contrast(1.06)\"><div style=\"padding:clamp(40px,6vw,72px) clamp(20px,4vw,60px);display:flex;flex-direction:column;gap:26px;border-left:2px solid rgba(243,242,242,.18)\">\n<div style=\"font:600 10px/1 Archivo,sans-serif;letter-spacing:.26em;color:#ff563c\">O ARTISTA<\u002Fdiv>\n<div style=\"font:800 clamp(38px,3.8vw,54px)/.94 Archivo,sans-serif;letter-spacing:-.035em;text-transform:uppercase\">Raphilski<br><\u002Fdiv>\n<div style=\"height:2px;background:rgba(243,242,242,.4)\"><\u002Fdiv>\n<div style=\"font:400 17px/1.6 Archivo,sans-serif;color:#e6e4e3;text-wrap:pretty\">Prazer, eu sou Raphael — conhecido no universo da tatuagem como Raphilski. Há mais de 10 anos transformo histórias, memórias e significados em arte.<\u002Fdiv>\n<div style=\"font:400 15px/1.6 Archivo,sans-serif;color:#9b9797;text-wrap:pretty\">Acredito que a tatuagem é uma das formas mais poderosas de expressão, capaz de representar identidade, eternizar emoções e marcar momentos de transformação. Cada projeto é desenvolvido de forma única, respeitando a essência e a história de cada pessoa.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background-color:#ff563c;background-image:url('texture-paper.jpg');background-size:cover;background-position:center;background-blend-mode:multiply;color:#131211;padding:clamp(40px,6vw,64px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,4vw,60px);align-items:center\">\n<div style=\"font:800 clamp(32px,3.3vw,46px)/1.02 Archivo,sans-serif;letter-spacing:-.03em;text-transform:uppercase;color:#fff;text-shadow:4px 4px 0 #131211\">Cada projeto respeita a essência e a história de cada pessoa.<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ goBook }}\" style=\"appearance:none;border:2px solid #131211;border-radius:0;background:transparent;color:#131211;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;font:800 14px/1 Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap\" style-hover=\"background:#131211;color:#ff563c\"><span>Começar meu projeto<\u002Fspan><span>→<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n\n<div id=\"estudio\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))\">\n<div style=\"padding:clamp(40px,6vw,72px) clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:24px\">\n<div style=\"font:600 10px/1 Archivo,sans-serif;letter-spacing:.26em;color:#ff563c\">ESTÚDIO<\u002Fdiv>\n<div style=\"font:800 clamp(38px,3.8vw,54px)/.94 Archivo,sans-serif;letter-s 42,242,.18);padding:22px 0;cursor:pointer\">\n<div style=\"display:flex;align-items:baseline;gap:20px\">\n<span style=\"width:30px;flex:none;font:600 11px/1 Archivo,sans-serif;color:#ff563c\">{{ c.n }}<\u002Fspan>\n<span style=\"flex:1;font:800 24px/1.06 Archivo,sans-serif;text-transform:uppercase;letter-spacing:-.02em\">{{ c.t }}<\u002Fspan>\n<span style=\"flex:none;font:400 20px/1 Archivo,sans-serif;color:#7d7979\">{{ c.sign }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"max-height:{{ c.h }};overflow:hidden;transition:max-height .32s cubic-bezier(.2,.8,.2,1)\">\n<div style=\"padding:14px 0 0 50px;font:400 15px/1.6 Archivo,sans-serif;color:#bab6b6;max-width:640px;text-wrap:pretty\">{{ c.b }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nconst WORKS = [\n  { id: 1, img: 'portfolio/01.jpg', pos: '50% 25%', title: 'Coruja e Bússola', style: '', tag: 'REALISMO', body: 'Braço', hours: '' },\n  { id: 2, img: 'portfolio/02.jpg', pos: '50% 35%', title: 'Caveira Ornamental', style: '', tag: 'PRETO E CINZA', body: 'Antebraço', hours: '' },\n  { id: 3, img: 'portfolio/03.jpg', pos: '50% 20%', title: 'Perna Triatlon', style: '', tag: 'COR', body: 'Perna', hours: '' },\n  { id: 4, img: 'portfolio/04.jpg', pos: '50% 25%', title: 'Retrato Realista', style: '', tag: 'REALISMO', body: 'Braço', hours: '' },\n  { id: 5, img: 'portfolio/05.jpg', pos: '50% 30%', title: 'Motociclista ao Pôr do Sol', style: '', tag: 'COR', body: 'Braço', hours: '' },\n  { id: 6, img: 'portfolio/06.jpg', pos: '50% 20%', title: 'Fé e Cavaleiro', style: '', tag: 'REALISMO', body: 'Perna', hours: '' },\n  { id: 7, img: 'portfolio/07.jpg', pos: '50% 30%', title: 'Leão Realista', style: '', tag: 'REALISMO', body: 'Ombro', hours: '' },\n  { id: 8, img: 'portfolio/08.jpg', pos: '50% 30%', title: 'Adaga Neotradicional', style: '', , title: 'Guerreira Nórdica', style: '', tag: 'REALISMO', body: 'Antebraço', hours: '' },\n  { id: 38, img: 'portfolio/38.jpg', pos: '50% 30%', title: 'Coragem', style: '', tag: 'PRETO E CINZA', body: 'Antebraço', hours: '' },\n  { id: 39, img: 'portfolio/39.jpg', pos: '50% 20%', title: 'Fortis Fortuna', style: '', tag: 'REALISMO', body: 'Perna', hours: '' },\n  { id: 40, img: 'portfolio/40.jpg', pos: '50% 25%', title: 'Busto Fragmentado', style: '', tag: 'REALISMO', body: 'Peito', hours: '' },\n];\nconst FILTERS = ['TUDO', 'REALISMO', 'PRETO E CINZA', 'COR'];\nconst STYLES = ['Hiper-realismo', 'Preto e cinza', 'Neo-realismo', 'Blackwork', 'Colorido'];\nconst PLACES = ['Braço', 'Antebraço', 'Costas', 'Perna', 'Peito', 'Costela', 'Mão', 'Outro'];\nconst SIZES = [['Até 10 cm', '2–3h'], ['10–20 cm', '4–6h'], ['Meia manga', '8–12h'], ['Manga fechada', '15h+']];\nconst BUDGETS = [['Até R$ 1.500', 'peça pequena'], ['R$ 1.500 – 3.000', 'média'], ['R$ 3.000 – 6.000', 'grande'], ['Acima de R$ 6.000', 'projeto longo'], ['Preciso de orientação', '—']];\nconst URGENCY = ['Este mês', 'Próximos 3 meses', 'Sem pressa', 'Só pesquisando'];\nconst SOURCES = ['Instagram', 'Google', 'Indicação', 'Anúncio', 'Já sou cliente'];\nconst PERIODS = ['Tardes', 'Noites', 'Fins de semana', 'Sextas', 'Sou flexível'];\nconst SKIN = [['I', '#f0d9c8'], ['II', '#e6c3a6'], ['III', '#cfa47f'], ['IV', '#a97650'], ['V', '#7a4c30'], ['VI', '#4a2b1c']];\nconst STEP_LABELS = ['Sua ideia', 'Corpo e tamanho', 'Referências', 'Seus dados', 'Contexto', 'Data desejada'];\nconst ASIDE = [\n  ['Conte a ideia', 'Sem compromisso: descreva o que você imagina e o estilo que te atrai. Leva 3 minutos.'],\n  ['Onde e quanto', 'O local do corpo e o tamanho definem quantas sessões o projeto vai pedir.'],\n  ['Mostre referências', 'Imagens ajudam mais que mil palavras — e aceleram muito o orçamento.'],\n  ['Quem é você', 'Só o necessário para eu te responder e organizar o atendimento.'],\n  ['Um pouco de contexto', 'Orçament , 'ocupado']];\nconst OFF = 'rgba(243,242,242,.22)';\nconst ON = '#ff563c';\n\nclass Component extends DCLogic {\n  state = {\n    view: 'site', idx: 0, filter: 'TUDO', step: 1, hero: 0,\n    day: null, slot: null, cal: 0, sync: 'idle', care: 0, refs: 1,\n    form: { desc: '', styles: [], color: 'Preto e cinza', cover: false, place: '', size: '', first: '', skin: 'III', name: '', phone: '', email: '', birth: '', city: '', budget: '', urgency: '', source: '', notes: '', periods: [] },\n  };\n\n  setF = (k, v) => this.setState(s => ({ form: { ...s.form, [k]: v } }));\n  toggleIn = (k, v, max) => this.setState(s => {\n    const cur = s.form[k];\n    let next = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];\n    if (max && next.length > max) next = next.slice(next.length - max);\n    return { form: { ...s.form, [k]: next } };\n  });\n  chip(label, active, pick, extra) {\n    return Object.assign({ label, pick, bd: active ? ON : OFF, bg: active ? ON : 'transparent', fg: active ? '#131211' : '#d7d3d3' }, extra || {});\n  }\n\n  renderVals() {\n    const st = this.state, f = st.form;\n    const step = Math.min(6, Math.max(1, st.step));\n    const shown = WORKS.filter(w => st.filter === 'TUDO' || w.tag === st.filter);\n    const work = WORKS[st.idx];\n    const ready = st.day && st.slot;\n    const slots = SLOT_DEF.map(([time, meta]) => {\n      const taken = meta === 'ocupado', active = st.slot === time;\n      return {\n        time, meta, pick: taken || !st.day ? () => {} : () => this.setState({ slot: time }),\n        bd: active ? ON : OFF, bg: active ? ON : 'transparent',\n        fg: taken ? '#605d5d' : active ? '#131211' : '#f3f2f2',\n        mfg: active ? 'rgba(19,18,17,.7)' : taken ? '#605d5d' : '#7d7979',\n        cur: taken || !st.day ? 'default' : 'pointer',\n      };\n    });\n    const now = new Date();\n    const minCal = bookableInMonth(0).length ? 0 : 1;\n    const cal = Math.max(st.cal, minCal);\n    const monthStart = new Date(now.getFullYear(), now.getMonth() + cal, 1);\n    const calYear = monthStart.getFullYear(), calMonth = monthStart.getMonth();\n    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();\n    const availDays = bookableInMonth(cal);\n    const cells = [];\n    for (let i = 0; i < monthStart.getDay(); i++) cells.push({ n: '', bg: 'transparent', fg: 'transparent', bd: 'transparent', cur: 'default', pick: () => {} });\n    for (let d = 1; d <= daysInMonth; d++) {\n      const av = availDays.includes(d), sel = st.day === d;\n      cells.push({\n        n: String(d), pick: av ? () => this.setState({ day: d, slot: null }) : () => {},\n        bg: sel ? ON : '#1c1a19', fg: sel ? '#131211' : av ? '#f3f2f2' : '#605d5d',\n        bd: sel ? ON : av ? 'rgba(255,86,60,.75)' : 'transparent', cur: av ? 'pointer' : 'default',\n      });\n    }\n    const when = st.day ? `${st.day} ${MONTHS_SHORT[calMonth]} ${calYear}${st.slot ? ' · ' + st.slot : ''}` : '—';\n    const syncTitles = { idle: 'Sincronizar sessão', connecting: 'Conectando…', done: 'Sincronizado' };\n    const syncBodies = {\n      idle: 'Assim que o artista confirmar, o horário entra na sua agenda com endereço, duração e lembrete. Sem sincronizar, você recebe só por WhatsApp.',\n      connecting: 'Autorizando o acesso à sua conta Google e criando o evento…',\n      done: 'Qualquer alteração feita pelo artista atualiza o evento automaticamente.',\n    };\n\n    return {\n      v: { site: st.view === 'site', artwork: st.view === 'artwork', book: st.view === 'book', confirm: st.view === 'confirm', aftercare: st.view === 'aftercare' },\n      notHome: st.view !== 'site',\n      menu: [\n        { label: 'Home', href: '#topo' }, { label: 'Artista', href: '#artista' },\n        { label: 'Portfólio', href: '#portfolio' }, { label: 'Estúdio', href: '#estudio' },\n      ].map(m => ({ ...m, go: () => this.setState({ view: 'site' }) })),\n      goSite: () => {\n        this.setState({ view: 'site' });\n        if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });\n      },\n      goBook: () => this.setState({ view: 'book', step: 1 }),\n      goAftercare: () => this.setState({ view: 'aftercare' }),\n      goBookStyle: () => this.setState(s => ({ view: 'book', step: 1, form: { ...s.form, styles: [WORKS[s.idx].style.split(' ·')[0]] } })),\n\n      stats: [{ n: '10+', k: 'ANOS DE CARREIRA' }, { n: '2K+', k: 'PROJETOS REALIZADOS' }, { n: 'SP', k: 'ALPHAVILLE · BARUERI' }],\n      filters: FILTERS.map(x => this.chip(x, st.filter === x, () => this.setState({ filter: x }))),\n      shown: shown.map(w => ({ ...w, open: () => this.setState({ view: 'artwork', idx: WORKS.indexOf(w) }) })),\n      hours: [\n        { d: 'TERÇA', t: '11:00 – 20:00', c: '#f3f2f2' }, { d: 'QUINTA', t: '11:00 – 20:00', c: '#f3f2f2' },\n        { d: 'SÁBADO', t: '11:00 – 20:00', c: '#f3f2f2' }, { d: 'DOM · SEG · QUA · SEX', t: 'fechado', c: '#605d5d' },\n      ],\n\n      work,\n      workSpecs: [\n        { k: 'ESTILO', v: work.tag === 'COR' ? 'Colorido' : work.tag === 'REALISMO' ? 'Realismo' : 'Preto e cinza' },\n        { k: 'TEMPO', v: work.hours },\n      ],\n      prevWork: () => this.setState(s => ({ idx: (s.idx + WORKS.length - 1) % WORKS.length })),\n      nextWork: () => this.setState(s => ({ idx: (s.idx + 1) % WORKS.length })),\n\n      s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4, s5: step === 5, s6: step === 6,\n      stepCounter: `PASSO ${step} DE 6`,\n      bars: [1, 2, 3, 4, 5, 6].map(n => ({ c: n <= step ? ON : 'rgba(243,242,242,.18)' })),\n      asideTitle: ASIDE[step - 1][0], asideBody: ASIDE[step - 1][1],\n      asideImg: WORKS[(step - 1) % 3].img,\n      stepList: STEP_LABELS.map((label, i) => {\n        const n = i + 1, done = n < step, cur = n === step;\n        return {\n          label, n: String(n).padStart(2, '0'), mark: done ? '✓' : cur ? '→' : '',\n          fg: cur ? '#f3f2f2' : done ? '#9b9797' : '#605d5d',\n          nfg: cur || done ? ON : '#605d5d',\n          line: cur ? ON : 'rgba(243,242,242,.18)',\n        };\n      }),\n      stepBack: () => (step > 1\n        ? this.setState(s => ({ step: Math.max(1, s.step - 1) }))\n        : this.setState({ view: 'site' })),\n      advance: () => {\n        if (step < 6) return this.setState(s => ({ step: Math.min(6, s.step + 1) }));\n        if (ready) this.setState({ view: 'confirm', sync: 'idle' });\n      },\n      ctaLabel: step === 6 ? 'Enviar pedido' : 'Continuar',\n      ctaBg: step === 6 && !ready ? '#2d2b2b' : ON,\n      ctaFg: step === 6 && !ready ? '#7d7979' : '#131211',\n\n      form: f,\n      setDesc: (e) => this.setF('desc', e.target.value),\n      setNotes: (e) => this.setF('notes', e.target.value),\n      styleOpts: STYLES.map(x => this.chip(x, f.styles.includes(x), () => this.toggleIn('styles', x, 2))),\n      colorOpts: ['Preto e cinza', 'Colorido'].map(x => this.chip(x, f.color === x, () => this.setF('color', x))),\n      placeOpts: PLACES.map(x => this.chip(x, f.place === x, () => this.setF('place', x))),\n      sizeOpts: SIZES.map(([x, h]) => this.chip(x, f.size === x, () => this.setF('size', x), { hint: h })),\n      firstOpts: ['Sim, é a primeira', 'Já tenho outras'].map(x => this.chip(x, f.first === x, () => this.setF('first', x))),\n      budgetOpts: BUDGETS.map(([x, h]) => this.chip(x, f.budget === x, () => this.setF('budget', x), { hint: h })),\n      urgencyOpts: URGENCY.map(x => this.chip(x, f.urgency === x, () => this.setF('urgency', x))),\n      sourceOpts: SOURCES.map(x => this.chip(x, f.source === x, () => this.setF('source', x))),\n      periodOpts: PERIODS.map(x => this.chip(x, f.periods.includes(x), () => this.toggleIn('periods', x))),\n      skinOpts: SKIN.map(([x, tone]) => ({ label: x, tone, pick: () => this.setF('skin', x), bd: f.skin === x ? ON : 'transparent', fg: f.skin === x ? '#ff563c' : '#7d7979' })),\n      toggleCover: () => this.setF('cover', !f.cover),\n      coverLabel: f.cover ? 'Sim, é um cover-up' : 'Não, pele limpa',\n      coverBd: f.cover ? ON : OFF, coverFg: f.cover ? '#f3f2f2' : '#9b9797',\n      coverPos: f.cover ? 'flex-end' : 'flex-start', coverKnob: f.cover ? ON : '#7d7979',\n      fields: [\n        { label: 'NOME COMPLETO', ph: 'Seu nome', value: f.name, set: (e) => this.setF('name', e.target.value), span: '1 / -1' },\n        { label: 'WHATSAPP', ph: '+55 11 90000-0000', value: f.phone, set: (e) => this.setF('phone', e.target.value), span: 'auto' },\n        { label: 'E-MAIL', ph: 'voce@email.com', value: f.email, set: (e) => this.setF('email', e.target.value), span: 'auto' },\n        { label: 'DATA DE NASCIMENTO', ph: 'DD/MM/AAAA', value: f.birth, set: (e) => this.setF('birth', e.target.value), span: 'auto' },\n        { label: 'CIDADE / BAIRRO', ph: 'Alphaville, Barueri', value: f.city, set: (e) => this.setF('city', e.target.value), span: 'auto' },\n      ],\n      refSlots: [0, 1, 2, 3].map(i => {\n        const filled = i < st.refs;\n        return {\n          act: () => this.setState(s => ({ refs: Math.min(4, Math.max(0, s.refs + (filled && i === s.refs - 1 ? -1 : 1))) })),\n          style: filled ? 'solid' : 'dashed', bd: filled ? ON : OFF,\n          bg: filled ? 'rgba(255,86,60,.1)' : '#1c1a19', fg: filled ? '#ff563c' : '#7d7979',\n          icon: filled ? '✓' : '+', label: filled ? `REFERÊNCIA ${i + 1}` : 'ARRASTE OU CLIQUE',\n        };\n      }),\n\n      dow: DOW, days: cells, slots,\n      monthTitle: `${MONTHS[calMonth]} ${calYear}`,\n      prevMonth: cal > minCal ? () => this.setState({ cal: cal - 1, day: null, slot: null }) : () => {},\n      nextMonth: cal < MAX_MONTHS_AHEAD ? () => this.setState({ cal: cal + 1, day: null, slot: null }) : () => {},\n      prevOp: cal > minCal ? '1' : '.3', prevCur: cal > minCal ? 'pointer' : 'default',\n      nextOp: cal < MAX_MONTHS_AHEAD ? '1' : '.3', nextCur: cal < MAX_MONTHS_AHEAD ? 'pointer' : 'default',\n      slotsLabel: st.day ? `HORÁRIOS · ${st.day} DE ${MONTHS[calMonth].toUpperCase()}` : 'ESCOLHA UM DIA DISPONÍVEL',\n      summary: [\n        { k: 'Estilo', v: f.styles.length ? f.styles.join(' + ') : '—' },\n        { k: 'Paleta', v: f.color },\n        { k: 'Local · tamanho', v: `${f.place || '—'} · ${f.size || '—'}` },\n        { k: 'Orçamento', v: f.budget || '—' },\n        { k: 'Prazo', v: f.urgency || '—' },\n        { k: 'Data desejada', v: when },\n      ],\n      confirmRows: [\n        { k: 'PEDIDO', v: '#RP-2026-014' }, { k: 'PREFERÊNCIA', v: when },\n        { k: 'PROJETO', v: f.styles.length ? f.styles.join(' + ') : 'A definir' },\n        { k: 'LOCAL · TAMANHO', v: `${f.place || '—'} · ${f.size || '—'}` },\n        { k: 'ORÇAMENTO', v: f.budget || '—' },\n        { k: 'CONTATO', v: f.name || 'Você' },\n      ],\n      syncPending: st.sync !== 'done', syncDone: st.sync === 'done',\n      syncTitle: syncTitles[st.sync], syncBody: syncBodies[st.sync],\n      syncCta: st.sync === 'connecting' ? 'Conectando…' : 'Conectar Google Agenda',\n      syncBd: st.sync === 'done' ? ON : OFF,\n      syncGlyph: st.sync === 'done' ? '✓' : st.sync === 'connecting' ? '···' : '+',\n      doSync: st.sync === 'connecting' ? () => {} : () => {\n        this.setState({ sync: 'connecting' });\n        setTimeout(() => this.setState({ sync: 'done' }), 1400);\n      },\n      eventWhen: when,\n      care: CARE.map(([t, b], i) => ({\n        n: String(i + 1).padStart(2, '0'), t, b, sign: st.care === i ? '−' : '+',\n        h: st.care === i ? '220px' : '0px',\n        toggle: () => this.setState(s => ({ care: s.care === i ? -1 : i })),\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<script src=\"wizard-integration.js\" defer><\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
